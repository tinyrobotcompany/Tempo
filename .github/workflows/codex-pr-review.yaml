name: Codex PR Review
on:
  pull_request_target:
    branches: [main, feature/secure-phone-access, feature/encrypted-identity-storage]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  codex-review:
    name: Codex Review
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Never check out or execute PR-head code with these credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Review exact PR head (fail closed)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_REVIEW_MODEL: ${{ vars.CODEX_REVIEW_MODEL || 'gpt-5.5' }}
          CODEX_REVIEW_DIFF_MAX: 120000
          CODEX_REVIEW_MAX_OUTPUT_TOKENS: 20000
          CODEX_REVIEW_REASONING_EFFORT: medium
        run: node .github/scripts/codex-pr-review.mjs
