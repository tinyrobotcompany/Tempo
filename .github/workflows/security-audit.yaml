name: Security Audit
on:
  workflow_call:
  schedule:
    - cron: "23 5 * * 1"
  push:
    branches: [main]
  pull_request:
    branches: [main, feature/secure-phone-access, feature/encrypted-identity-storage]
permissions:
  contents: read
concurrency:
  # Include the workflow name: when called from Publish OTA Release this run must not cancel the standalone audit.
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Direct CLI avoids gitleaks-action's organisation-license requirement.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: gitleaks/gitleaks
          ref: 107a41827bb6698dbbff756b2300537774a1d84c
          path: .artifacts/gitleaks
          persist-credentials: false
      - name: Build pinned scanner and scan history
        run: |
          cd .artifacts/gitleaks
          go build -o "$RUNNER_TEMP/gitleaks" .
          cd ../..
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner .
  code-scanning:
    name: CodeQL
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Gate the full repository on PRs as on main, including unchanged findings.
      CODEQL_ACTION_DIFF_INFORMED_QUERIES: 'false'
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python, actions, c-cpp]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
          output: ${{ runner.temp }}/codeql-results
      - name: Block high-severity findings
        run: node .github/scripts/check-security-results.mjs "$RUNNER_TEMP/codeql-results"
  dependencies:
    name: Locked Dependency Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - run: bash scripts/test-certificates.sh
      - name: Audit current advisories against locked runtime and test packages
        run: build-host/dependencies/certificate-service-python314/bin/pip-audit --no-deps --disable-pip -r services/certificates/requirements-test.txt
  required:
    name: Security Audit Required
    runs-on: ubuntu-24.04
    needs: [secret-scan, code-scanning, dependencies]
    if: always()
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 -c 'import json,os; assert all(j["result"] == "success" for j in json.loads(os.environ["RESULTS"]).values())'
