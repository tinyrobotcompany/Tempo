name: Security Audit
on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Direct CLI avoids gitleaks-action's organisation-license requirement.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: gitleaks/gitleaks
          ref: 107a41827bb6698dbbff756b2300537774a1d84c
          path: .artifacts/gitleaks
          persist-credentials: false
      - name: Build pinned scanner and scan history
        run: |
          cd .artifacts/gitleaks
          go build -o "$RUNNER_TEMP/gitleaks" .
          cd ../..
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner .
  code-scanning:
    name: CodeQL Scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Gate the full repository on PRs as on main, including unchanged findings.
      CODEQL_ACTION_DIFF_INFORMED_QUERIES: 'false'
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
          output: ${{ runner.temp }}/codeql-results
      - name: Block high-severity findings
        run: node .github/scripts/check-security-results.mjs "$RUNNER_TEMP/codeql-results"
  required:
    name: Security Audit Required
    runs-on: ubuntu-24.04
    needs: [secret-scan, code-scanning]
    if: always()
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 -c 'import json,os; assert all(j["result"] == "success" for j in json.loads(os.environ["RESULTS"]).values())'
