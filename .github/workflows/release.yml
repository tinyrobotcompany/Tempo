name: Legacy Source Draft
on:
  push:
    tags: ['source-v*']
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  validation:
    uses: ./.github/workflows/ci.yaml
  security:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/security-audit.yaml
  release:
    name: Create Validated Draft Release
    needs: [validation, security]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Require a main-branch commit and matching firmware version
        run: |
          release_commit=$(git rev-parse --verify "${GITHUB_REF}^{commit}")
          event_commit=$(git rev-parse --verify "${GITHUB_SHA}^{commit}")
          test "$release_commit" = "$event_commit"
          git checkout --detach "$release_commit"
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          python3 scripts/release.py check --tag "${GITHUB_REF_NAME#source-}"
      - name: Create source-only draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then exit 0; fi
          gh release create "$GITHUB_REF_NAME" --target "$GITHUB_SHA" --title "Tempo $GITHUB_REF_NAME" --verify-tag --draft --prerelease --notes-file "docs/releases/${GITHUB_REF_NAME#source-v}.md"
