name: Draft Release
on:
  push:
    tags: ['v*']
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  validation:
    uses: ./.github/workflows/ci.yaml
  security:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/security-audit.yaml
  release:
    name: Create Validated Draft Release
    needs: [validation, security]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Require a main-branch commit and matching firmware version
        run: |
          git checkout --detach "$GITHUB_SHA"
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          python3 scripts/release.py check --tag "$GITHUB_REF_NAME"
      - name: Create source-only draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then exit 0; fi
          gh release create "$GITHUB_REF_NAME" --target "$GITHUB_SHA" --title "Tempo $GITHUB_REF_NAME" --verify-tag --draft --notes-file "docs/releases/${GITHUB_REF_NAME#v}.md"
