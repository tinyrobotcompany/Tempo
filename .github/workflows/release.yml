name: Draft Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  validation:
    uses: ./.github/workflows/ci.yaml
  security:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/security-audit.yaml
  release:
    name: Create Validated Draft Release
    needs: [validation, security]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a main-branch commit and matching firmware version
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python3 -c 'import os,re,pathlib; version=re.search(r"project\(weather_station VERSION ([0-9]+\.[0-9]+\.[0-9]+)\)",pathlib.Path("firmware/CMakeLists.txt").read_text()).group(1); assert os.environ["GITHUB_REF_NAME"] == "v"+version'
      - name: Create source-only draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then exit 0; fi
          gh release create "$GITHUB_REF_NAME" --target "$GITHUB_SHA" --title "Tempo $GITHUB_REF_NAME" --draft --generate-notes
