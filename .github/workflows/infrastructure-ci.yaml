name: Infrastructure validation
on:
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    name: Infrastructure Required
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Test infrastructure guards
        run: bash .github/scripts/infrastructure.test.sh
      - name: Compile Bicep
        run: |
          mkdir -p build-host/infrastructure
          az bicep build --file infra/certificates/main.bicep --outfile build-host/infrastructure/template.json
          az bicep build --file infra/certificates/bootstrap.bicep --outfile build-host/infrastructure/bootstrap.json
          jq -e '.resources | length > 0' build-host/infrastructure/template.json
          jq -e '.parameters.project.defaultValue | test("^[a-z0-9]{2,8}$")' build-host/infrastructure/template.json
          jq -e '.parameters.imageDigest.defaultValue | . == "" or test("^[a-f0-9]{64}$")' build-host/infrastructure/template.json
      - name: Check delivery role delegation
        run: bash .github/scripts/delegation.test.sh build-host/infrastructure/bootstrap.json
