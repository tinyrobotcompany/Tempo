name: Infrastructure deployment
on:
  push:
    branches: [main]
    paths:
      - 'infra/certificates/**/*.bicep'
permissions:
  contents: read
concurrency:
  group: tempo-infrastructure-live
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/infrastructure-ci.yaml
  preview:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.repository == 'tinyrobotcompany/Tempo'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: tempo-infrastructure
    env:
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_LOCATION: westeurope
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Verify deployment context
        run: bash scripts/infrastructure/check-context.sh
      - name: Preview Bicep deployment
        env:
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          set -euo pipefail
          mkdir -p build-host/infrastructure
          # Recipient from the environment into the runner temp dir, never the uploaded plan.
          : "${ALERT_EMAIL:?Create the ALERT_EMAIL repository secret before deploying}"
          (umask 077; jq -n '{contentVersion: "1.0.0.0", parameters: {alertEmail: {value: env.ALERT_EMAIL}}}' > "$RUNNER_TEMP/alert.parameters.json")
          az bicep build --file infra/certificates/main.bicep --outfile build-host/infrastructure/template.json
          az deployment sub what-if --subscription "$AZURE_SUBSCRIPTION_ID" \
            --location "$AZURE_LOCATION" --name tempo-infrastructure \
            --parameters @"$RUNNER_TEMP/alert.parameters.json" \
            --template-file build-host/infrastructure/template.json --result-format ResourceIdOnly --no-pretty-print -o json > build-host/infrastructure/preview.json
          jq -e ' .status == "Succeeded" and all(.changes[]; .changeType != "Delete")' build-host/infrastructure/preview.json
          jq -r '.changes[] | "\(.changeType): \(.resourceId)"' build-host/infrastructure/preview.json >> "$GITHUB_STEP_SUMMARY"
          sha256sum build-host/infrastructure/template.json > build-host/infrastructure/template.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: infrastructure-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: build-host/infrastructure/
          retention-days: 14
          if-no-files-found: error
  apply:
    needs: preview
    if: github.ref == 'refs/heads/main' && github.repository == 'tinyrobotcompany/Tempo'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: tempo-infrastructure
    env:
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_LOCATION: westeurope
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: infrastructure-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: build-host/infrastructure
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Verify deployment context
        run: bash scripts/infrastructure/check-context.sh
      - name: Deploy approved Bicep
        env:
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          set -euo pipefail
          sha256sum -c build-host/infrastructure/template.sha256
          # Recipient from the environment into the runner temp dir, never the uploaded plan.
          : "${ALERT_EMAIL:?Create the ALERT_EMAIL repository secret before deploying}"
          (umask 077; jq -n '{contentVersion: "1.0.0.0", parameters: {alertEmail: {value: env.ALERT_EMAIL}}}' > "$RUNNER_TEMP/alert.parameters.json")
          az deployment sub create --subscription "$AZURE_SUBSCRIPTION_ID" \
            --location "$AZURE_LOCATION" --name tempo-infrastructure \
            --parameters @"$RUNNER_TEMP/alert.parameters.json" \
            --template-file build-host/infrastructure/template.json \
            --query properties.outputs -o json > build-host/infrastructure/outputs.json
          bash scripts/infrastructure/verify.sh build-host/infrastructure/outputs.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: success()
        with:
          name: infrastructure-outputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: build-host/infrastructure/outputs.json
          retention-days: 14
          if-no-files-found: error
