name: CI
on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main, feature/secure-phone-access, feature/encrypted-identity-storage]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  infrastructure-changes:
    name: Detect Infrastructure Changes
    runs-on: ubuntu-24.04
    outputs:
      infrastructure: ${{ steps.detect.outputs.infrastructure }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: detect
        run: python3 .github/scripts/infrastructure-changes.py
  infrastructure:
    needs: infrastructure-changes
    if: needs.infrastructure-changes.outputs.infrastructure == 'true'
    uses: ./.github/workflows/infrastructure-ci.yaml
  changes:
    name: Detect Firmware Changes
    runs-on: ubuntu-24.04
    outputs:
      firmware: ${{ steps.detect.outputs.firmware }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: detect
        run: python3 .github/scripts/firmware-changes.py
  host-tests:
    name: All Unit Tests
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Install host validation tools
        run: brew install cmake actionlint python@3.14
      - name: Validate release change notes
        run: python3 scripts/release.py check
      - name: Run complete test suite
        env:
          TEMPO_CERTIFICATES_SEPARATE_JOB: '1'
        run: bash scripts/test-all.sh
      - name: Retain test logs and coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: host-validation-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            build-host/test-results/latest.log
            build-host/coverage/firmware.json
            build-host/coverage/unit.json
            build-host/coverage/browser.txt
            build-host/coverage/html/
  certificates:
    name: Certificate Service Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - run: bash scripts/test-certificates.sh
      - name: Audit locked service dependencies
        run: build-host/dependencies/certificate-service-python314/bin/pip-audit --no-deps --disable-pip -r services/certificates/requirements-test.txt
  firmware:
    name: ESP32-P4 Build
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout tested ESP-IDF revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: espressif/esp-idf
          ref: fff9895c82d744c7237be8847347bdd1b07c6643
          path: .artifacts/esp-idf
          submodules: recursive
          persist-credentials: false
      - name: Install ESP32-P4 toolchain
        run: .artifacts/esp-idf/install.sh esp32p4
      - name: Build without production credentials and verify PSRAM placement
        shell: bash
        run: |
          test ! -f .env
          source .artifacts/esp-idf/export.sh
          bash scripts/test-phone-tls-real.sh
          bash scripts/test-identity-real.sh
          TEMPO_CI_BUILD=1 idf.py -C firmware build
          python3 scripts/check-transport-memory.py
  changeset:
    name: Changeset Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: bash .github/scripts/changeset-check.sh
  required:
    name: CI Required
    runs-on: ubuntu-24.04
    needs: [changes, host-tests, firmware, changeset, certificates, infrastructure-changes, infrastructure]
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require all validation jobs
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/firmware-changes.py
