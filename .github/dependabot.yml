version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    commit-message:
      prefix: build
      include: scope
    groups:
      # Routine updates share one PR, including all coupled CodeQL steps.
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
      # Security updates are separate from the routine monthly update schedule.
      codeql-security:
        applies-to: security-updates
        patterns:
          - "github/codeql-action/*"
